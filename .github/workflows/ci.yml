name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Fetch source
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pull request source without checkout action
        shell: bash
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.event.pull_request.head.sha || github.sha }}"
          git checkout --detach FETCH_HEAD
          node --version
          npm --version

  dependencies:
    name: npm ci
    runs-on: ubuntu-latest
    needs: source
    steps:
      - name: Fetch source
        shell: bash
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.event.pull_request.head.sha || github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

  build:
    name: TypeScript build
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - name: Fetch source
        shell: bash
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.event.pull_request.head.sha || github.sha }}"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  test:
    name: Vitest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Fetch source
        shell: bash
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.event.pull_request.head.sha || github.sha }}"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --reporter=verbose
