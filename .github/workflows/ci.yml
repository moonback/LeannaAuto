name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile TypeScript and capture diagnostics
        id: compile
        shell: bash
        run: |
          set +e
          npm run build > typescript-build.log 2>&1
          result=$?
          cat typescript-build.log
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-build-diagnostics
          path: typescript-build.log
          if-no-files-found: warn
          retention-days: 3
      - name: Mark build result
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1

  test:
    name: Vitest suite
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests and capture diagnostics
        id: tests
        shell: bash
        run: |
          set +e
          npm test -- --reporter=verbose > vitest.log 2>&1
          result=$?
          cat vitest.log
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Vitest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-diagnostics
          path: vitest.log
          if-no-files-found: warn
          retention-days: 3
      - name: Mark test result
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
