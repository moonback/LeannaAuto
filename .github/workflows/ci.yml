name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency installation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and capture log
        id: install
        shell: bash
        run: |
          set +e
          npm ci > npm-install.log 2>&1
          result=$?
          cat npm-install.log
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-install-diagnostics
          path: npm-install.log
          if-no-files-found: warn
          retention-days: 3
      - name: Mark install result
        if: steps.install.outputs.exit_code != '0'
        run: exit 1

  build:
    name: TypeScript compilation
    runs-on: ubuntu-latest
    needs: dependencies
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile TypeScript
        run: npm run build

  test:
    name: Vitest suite
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npm test -- --reporter=verbose
