name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  checkout:
    name: Repository checkout
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD }}

  node:
    name: Node.js toolchain
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD }}
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

  dependencies:
    name: npm ci
    runs-on: ubuntu-latest
    needs: node
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD }}
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

  build:
    name: TypeScript build
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD }}
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  test:
    name: Vitest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD }}
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --reporter=verbose
